name: Build Cantio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build (all)
        run: python build.py all

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Cantio-Setup-*.exe
          if-no-files-found: warn

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (all)
        run: python build.py all

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: Cantio-*-macOS.dmg
          if-no-files-found: warn

  # ── GitHub Release ─────────────────────────────────────────────────────────
  # Rulează doar la push de tag (nu la workflow_dispatch manual)
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release-files

      - name: Create GitHub Release and upload files
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" release-files/* \
            --repo "${{ github.repository }}" \
            --title "Cantio $TAG" \
            --notes "## Cantio $TAG

          ### Descărcare
          - **Windows**: \`Cantio-Setup-*-Windows.exe\` — rulează ca Administrator
          - **macOS**: \`Cantio-*-macOS.dmg\` — trage în Applications (right-click → Open prima dată)

          ### Cerințe
          - Windows 10/11 64-bit sau macOS 10.14+
          - 4 GB RAM, 500 MB spațiu liber"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
