name: Build Cantio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build (all)
        run: python build.py all

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: CantioPresenter-Setup-*.exe
          if-no-files-found: error

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (all)
        run: python build.py all

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: CantioPresenter-*-macOS.dmg
          if-no-files-found: warn

      # La rulare manuala (workflow_dispatch) ataseaza DMG-ul direct pe release-ul
      # existent, fara descarcare locala. Se face pe runner-ul GitHub (retea rapida).
      - name: Attach DMG to existing release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: gh release upload v1.5.2.1 CantioPresenter-*-macOS.dmg --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── GitHub Release ─────────────────────────────────────────────────────────
  # Rulează doar la push de tag (nu la workflow_dispatch manual)
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # Rulează la tag dacă build-ul Windows a reușit — chiar dacă macOS a eșuat
    # (Windows e prioritatea; DMG-ul se adaugă doar dacă există).
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files

      - name: Download macOS artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release-files

      - name: Create GitHub Release and upload files
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" release-files/* \
            --repo "${{ github.repository }}" \
            --title "CantioPresenter $TAG" \
            --notes "## CantioPresenter $TAG

          ### Descărcare
          - **Windows**: \`CantioPresenter-Setup-*-Windows.exe\` — rulează ca Administrator
          - **macOS**: \`CantioPresenter-*-macOS.dmg\` — trage în Applications (right-click → Open prima dată)

          ### Noutăți 1.5.2
          - Overlay-uri peste ecranul live (ceas, ticker, logo, forme)
          - Control complet de pe telefon (Remote): previzualizare 1:1, Biblie, Looks, Macros
          - Fundaluri & teme noi gata-făcute + casetă text liberă + fundal per etichetă
          - Traducere mult mai bună (DeepL) + 10 limbi offline
          - Performanță (GPU) + zeci de corecții

          ### Cerințe
          - Windows 10/11 64-bit (sau macOS 10.14+)
          - 4 GB RAM, 500 MB spațiu liber

          **Backup:** fă o copie a folderului \`Cantio\` înainte de instalare (cântările sunt păstrate oricum)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
