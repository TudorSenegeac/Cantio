<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Cantio — Editor Teme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #14141c; color: #cdd6f4;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: #181825; border-bottom: 1px solid #2a2a3a; }
    #topbar .title { color: #89b4fa; font-weight: 600; }
    #sampleText { flex: 1; background: #1c1c2a; color: #e0e0e0; border: 1px solid #313244;
      border-radius: 5px; padding: 7px 10px; font-size: 12px; resize: none; height: 34px; }
    button { background: #1e1e2e; color: #bbb; border: 1px solid #333; border-radius: 5px;
      padding: 7px 14px; font-size: 12px; cursor: pointer; }
    button:hover { background: #313244; color: #fff; }
    button.primary { background: #1c3a5a; color: #89dceb; border-color: #5294e2; }
    button.primary:hover { background: #234b73; }
    #main { flex: 1; display: flex; min-height: 0; }
    #stage { flex: 1; display: flex; align-items: center; justify-content: center;
      background: #0d0d14; padding: 16px; min-width: 0; }
    #canvasWrap { position: relative; box-shadow: 0 6px 30px rgba(0,0,0,.6); }
    #preview { display: block; background: #000; border-radius: 4px; }
    #sidebar { width: 300px; background: #181825; border-left: 1px solid #2a2a3a;
      overflow-y: auto; padding: 10px 12px; }
    .grp-h { color: #89b4fa; font-size: 10px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; margin: 14px 0 6px; border-bottom: 1px solid #2a2a3a; padding-bottom: 3px; }
    .grp-h:first-child { margin-top: 0; }
    .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .row label { flex: 0 0 92px; color: #a6adc8; font-size: 11px; }
    .row .ctl { flex: 1; display: flex; align-items: center; gap: 6px; }
    input[type=range] { flex: 1; accent-color: #5294e2; }
    input[type=text], input[type=number], select { background: #1c1c2a; color: #ddd;
      border: 1px solid #313244; border-radius: 4px; padding: 4px 6px; font-size: 11px; width: 100%; }
    input[type=color] { width: 34px; height: 24px; border: 1px solid #313244; border-radius: 4px;
      background: none; cursor: pointer; padding: 0; }
    .val { color: #6c7086; font-size: 10px; min-width: 30px; text-align: right; }
    .chk { display: flex; align-items: center; gap: 5px; color: #a6adc8; font-size: 11px; cursor: pointer; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tabs button { flex: 1; padding: 5px; font-size: 11px; }
    .tabs button.active { background: #1c3a5a; color: #89dceb; border-color: #5294e2; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <span class="title">🎨 Editor Teme</span>
      <span id="themeName" style="color:#a6adc8;"></span>
      <textarea id="sampleText" placeholder="Scrie text de probă…"></textarea>
      <button id="btnSave" class="primary">💾 Salvează</button>
      <button id="btnClose">✕</button>
    </div>
    <div id="main">
      <div id="stage">
        <div id="canvasWrap">
          <canvas id="preview" width="960" height="540"></canvas>
        </div>
      </div>
      <div id="sidebar">
        <div class="tabs">
          <button data-tab="text" class="active">Text</button>
          <button data-tab="bg">Fundal</button>
          <button data-tab="layout">Layout</button>
        </div>
        <div id="panel"></div>
      </div>
    </div>
  </div>
  <script src="bg-engine.js"></script>
  <script src="theme-editor.js"></script>
</body>
</html>
